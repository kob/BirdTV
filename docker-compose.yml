services:
  birdtv:
    image: ${DOCKER_IMAGE:-kob521/birdtv}:latest
    container_name: birdtv
    restart: unless-stopped
    ports:
      - "${PORT:-8771}:8771"
      - "${BIRDTV_SSL_PORT:-8772}:8772"
    environment:
      - HOST=0.0.0.0
      - PORT=8771
      # 认证
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-change-me-in-production}
      - AUTH_TOKEN_EXPIRE_DAYS=${AUTH_TOKEN_EXPIRE_DAYS:-7}
      - AUTH_DEFAULT_ADMIN=${AUTH_DEFAULT_ADMIN:-admin}
      - AUTH_DEFAULT_PASSWORD=${AUTH_DEFAULT_PASSWORD:-admin123}
      # KVRocks
      - AUTH_REDIS_HOST=${AUTH_REDIS_HOST:-kvrocks}
      - AUTH_REDIS_PORT=${AUTH_REDIS_PORT:-6666}
      - AUTH_REDIS_PASSWORD=${AUTH_REDIS_PASSWORD:-}
      # 多实例隔离
      - BIRDTV_SYSTEM_ID=${BIRDTV_SYSTEM_ID:-default}
      - REDIS_DATA_PREFIX=${REDIS_DATA_PREFIX:-birdtv:storage:}
      - REDIS_PREFIX=${REDIS_PREFIX:-birdtv}
      - SERVER_ID=${SERVER_ID:-default}
      # M3U 代理
      - M3U_PROXY_TIMEOUT_MS=${M3U_PROXY_TIMEOUT_MS:-40000}
      - M3U_PROXY_REDIRECT_LIMIT=${M3U_PROXY_REDIRECT_LIMIT:-3}
      - M3U_PROXY_DEFAULT_UA=${M3U_PROXY_DEFAULT_UA:-okhttp/4.3}
      # Cloudflare Worker
      - CLOUDFLARE_WORKER_URL=${CLOUDFLARE_WORKER_URL:-}
      - CLOUDFLARE_WORKER_DOMAINS=${CLOUDFLARE_WORKER_DOMAINS:-}
      # Deno Deploy 代理
      - DENO_PROXY_URL=${DENO_PROXY_URL:-}
      - DENO_PROXY_DOMAINS=${DENO_PROXY_DOMAINS:-}
      # ESA 代理
      - ESA_PROXY_URL=${ESA_PROXY_URL:-}
      - ESA_PROXY_DOMAINS=${ESA_PROXY_DOMAINS:-}
      # SSL/HTTPS
      - BIRDTV_SSL_KEY=${BIRDTV_SSL_KEY:-}
      - BIRDTV_SSL_CERT=${BIRDTV_SSL_CERT:-}
      - BIRDTV_SSL_PORT=${BIRDTV_SSL_PORT:-8772}
    volumes:
      - birdtv-data:/app/data
    depends_on:
      birdtv-kvrocks:
        condition: service_healthy

  birdtv-kvrocks:
    image: apache/kvrocks:2.11.0
    container_name: birdtv-kvrocks
    restart: unless-stopped
    ports:
      - "${KVROCKS_PORT:-6666}:6666"
    volumes:
      - kvrocks-data:/var/lib/kvrocks
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-p", "6666", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  birdtv-data:
    name: birdtv-data
  kvrocks-data:
    name: birdtv-kvrocks-data
