<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BirdTV Player</title>
    <link rel="icon" href="/assets/favicon-Cp3VK451.ico" sizes="any">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.18/controls.min.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.18/shaka-player.compiled.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.18/shaka-player.ui.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/artplayer@5.1.1/dist/artplayer.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"></script>
    <link rel="stylesheet" href="/assets/index-BCIv8emZ.css">
    <link rel="stylesheet" href="/assets/mobile-fix.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #eee;
        }
        .app-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100vh;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }
        .sidebar {
            background: #16213e;
            border-right: 1px solid #0f3460;
            overflow-y: auto;
            padding: 16px;
        }
        .main-content {
            overflow-y: auto;
            padding: 16px;
        }
        .card {
            background: #1f4068;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .channel-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .channel-item {
            background: #0f3460;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .channel-item:hover {
            background: #1a1a2e;
        }
        .channel-item.active {
            background: #e94560;
        }
        .channel-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .channel-info {
            font-size: 12px;
            color: #aaa;
        }
        .video-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
        }
        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        .info-item {
            background: #1f4068;
            border-radius: 6px;
            padding: 12px;
        }
        .info-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }
        .info-value {
            font-weight: 600;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #aaa;
        }
        .error {
            background: #e94560;
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #c7364d;
        }
        .btn-secondary {
            background: #1f4068;
        }
        .btn-secondary:hover {
            background: #1a3352;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="card">
                <h3 style="margin: 0 0 12px 0;">频道列表</h3>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="搜索频道..."
                    style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee;"
                >
            </div>
            <div id="channelList" class="channel-list">
                <div class="loading">加载频道...</div>
            </div>
        </aside>

        <main class="main-content">
            <div class="header">
                <h1>BirdTV Player</h1>
                <div class="user-info">
                    <span id="userInfo">未登录</span>
                    <button id="loginBtn" class="btn">登录</button>
                    <button id="logoutBtn" class="btn btn-secondary" style="display: none;">退出</button>
                </div>
            </div>

            <div class="video-container">
                <video id="video" autoplay controls playsinline data-shaka-player></video>
            </div>

            <div class="info-panel">
                <div class="info-item">
                    <div class="info-label">当前频道</div>
                    <div class="info-value" id="currentChannel">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">播放器类型</div>
                    <div class="info-value" id="playerType">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">分辨率</div>
                    <div class="info-value" id="resolution">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">状态</div>
                    <div class="info-value" id="status">等待播放</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // API 配置
        const API_BASE = window.location.origin;
        let authToken = localStorage.getItem('authToken');

        // DOM 元素
        const channelList = document.getElementById('channelList');
        const searchInput = document.getElementById('searchInput');
        const video = document.getElementById('video');
        const userInfo = document.getElementById('userInfo');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        // 应用状态
        let channels = [];
        let currentChannel = null;

        // 初始化
        async function init() {
            await checkAuth();
            await loadChannels();
            setupEventListeners();
        }

        // 检查认证状态
        async function checkAuth() {
            const response = await fetch('/health');
            const data = await response.json();

            if (data.authEnabled) {
                if (authToken) {
                    await getUserInfo();
                    loginBtn.style.display = 'none';
                    logoutBtn.style.display = 'inline-block';
                } else {
                    userInfo.textContent = '未登录';
                    loginBtn.style.display = 'inline-block';
                    logoutBtn.style.display = 'none';
                }
            } else {
                userInfo.textContent = '无需登录';
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        }

        // 获取用户信息
        async function getUserInfo() {
            try {
                const response = await fetch('/api/auth/userinfo', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.ok) {
                        userInfo.textContent = result.data.username;
                    }
                }
            } catch (error) {
                console.error('获取用户信息失败:', error);
            }
        }

        // 加载频道列表
        async function loadChannels() {
            try {
                channelList.innerHTML = '<div class="loading">加载频道...</div>';

                const headers = {};
                if (authToken) {
                    headers['Authorization'] = `Bearer ${authToken}`;
                }

                const response = await fetch('/api/channels', { headers });

                if (response.ok) {
                    const result = await response.json();
                    if (result.ok) {
                        channels = result.data;
                        renderChannels();
                    }
                } else {
                    channelList.innerHTML = '<div class="error">加载频道失败</div>';
                }
            } catch (error) {
                console.error('加载频道失败:', error);
                channelList.innerHTML = '<div class="error">加载频道失败</div>';
            }
        }

        // 渲染频道列表
        function renderChannels(filter = '') {
            const filteredChannels = channels.filter(ch =>
                ch.name.toLowerCase().includes(filter.toLowerCase())
            );

            if (filteredChannels.length === 0) {
                channelList.innerHTML = '<div style="text-align: center; color: #aaa; padding: 20px;">暂无频道</div>';
                return;
            }

            channelList.innerHTML = filteredChannels.map(ch => `
                <li class="channel-item ${currentChannel && currentChannel.id === ch.id ? 'active' : ''}"
                    data-id="${ch.id}">
                    <div class="channel-name">${escapeHtml(ch.name)}</div>
                    <div class="channel-info">${ch.streamType || 'auto'} · ${ch.playerType || 'auto'}</div>
                </li>
            `).join('');

            // 添加点击事件
            channelList.querySelectorAll('.channel-item').forEach(item => {
                item.addEventListener('click', () => {
                    const channelId = item.dataset.id;
                    const channel = channels.find(ch => ch.id === channelId);
                    if (channel) {
                        playChannel(channel);
                    }
                });
            });
        }

        // 播放频道
        function playChannel(channel) {
            currentChannel = channel;
            renderChannels(searchInput.value);

            document.getElementById('currentChannel').textContent = channel.name;
            document.getElementById('playerType').textContent = channel.playerType || 'auto';
            document.getElementById('status').textContent = '加载中...';

            // 这里应该集成实际的播放器
            // 暂时使用原生播放器
            video.src = channel.url;
            video.play().catch(error => {
                console.error('播放失败:', error);
                document.getElementById('status').textContent = '播放失败';
            });
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 设置事件监听
        function setupEventListeners() {
            // 搜索
            searchInput.addEventListener('input', (e) => {
                renderChannels(e.target.value);
            });

            // 登录
            loginBtn.addEventListener('click', () => {
                window.location.href = '/login.html';
            });

            // 退出
            logoutBtn.addEventListener('click', async () => {
                try {
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${authToken}`
                        }
                    });
                } catch (error) {
                    console.error('退出失败:', error);
                }

                localStorage.removeItem('authToken');
                authToken = null;
                await checkAuth();
            });

            // 视频事件
            video.addEventListener('play', () => {
                document.getElementById('status').textContent = '播放中';
            });

            video.addEventListener('pause', () => {
                document.getElementById('status').textContent = '已暂停';
            });

            video.addEventListener('ended', () => {
                document.getElementById('status').textContent = '已结束';
            });

            video.addEventListener('error', () => {
                document.getElementById('status').textContent = '播放错误';
            });
        }

        // 启动
        init();
    </script>
</body>
</html>
