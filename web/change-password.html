<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - BirdTV</title>
    <link rel="stylesheet" href="/assets/luna-theme.css">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('birdtv.theme') || 'luna';
                var finalTheme = theme;
                if (theme === 'auto') {
                    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    finalTheme = dark ? 'graphite' : 'mist';
                }
                document.documentElement.setAttribute('data-theme', finalTheme);
            } catch {}
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(900px 500px at 80% -10%, rgba(76, 163, 255, 0.18), transparent 70%),
                radial-gradient(700px 420px at -10% 100%, rgba(108, 226, 255, 0.13), transparent 65%),
                linear-gradient(145deg, var(--bg-0) 0%, var(--bg-1) 50%, var(--bg-2) 100%);
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 280px;
            height: 280px;
            right: 8%;
            top: 10%;
            background: rgba(79, 157, 255, 0.28);
            animation: drift 10s ease-in-out infinite;
        }

        body::after {
            width: 240px;
            height: 240px;
            left: 8%;
            bottom: 8%;
            background: rgba(108, 226, 255, 0.2);
            animation: drift 12s ease-in-out infinite reverse;
        }

        .change-password-container {
            position: relative;
            z-index: 1;
            width: min(420px, 100%);
            padding: 34px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background:
                linear-gradient(160deg, rgba(255, 255, 255, 0.06), transparent 45%),
                linear-gradient(180deg, var(--card), var(--card-strong));
            box-shadow:
                0 26px 70px rgba(3, 10, 26, 0.75),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: rise-in .6s cubic-bezier(.25,.8,.25,1);
        }

        .change-password-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .change-password-header h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 0.03em;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #d4e6ff 0%, #77bdff 65%, #7ee9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .change-password-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .warning-banner {
            background: rgba(255, 179, 0, 0.12);
            color: #ffd89b;
            border: 1px solid rgba(255, 179, 0, 0.35);
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: #b7c9e8;
            font-weight: 600;
            margin-bottom: 7px;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid rgba(145, 184, 255, 0.2);
            border-radius: 10px;
            font-size: 15px;
            color: var(--text);
            background: rgba(14, 28, 57, 0.78);
            transition: border-color .25s, box-shadow .25s, transform .25s;
        }

        .form-group input::placeholder {
            color: rgba(154, 177, 217, 0.64);
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(108, 226, 255, 0.7);
            box-shadow: 0 0 0 3px rgba(108, 226, 255, 0.2);
            transform: translateY(-1px);
        }

        .change-password-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 700;
            color: #031128;
            cursor: pointer;
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            box-shadow: 0 10px 28px rgba(69, 154, 255, 0.35);
            transition: transform .22s, box-shadow .22s, filter .22s;
        }

        .change-password-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 34px rgba(69, 154, 255, 0.45);
            filter: saturate(1.08);
        }

        .change-password-button:active {
            transform: translateY(0);
        }

        .change-password-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            background: rgba(255, 109, 122, 0.12);
            color: #ff9fa8;
            border: 1px solid rgba(255, 109, 122, 0.35);
            padding: 11px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(78, 214, 122, 0.12);
            color: #9bf7c0;
            border: 1px solid rgba(78, 214, 122, 0.35);
            padding: 11px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 16px;
        }

        .loading-spinner.show {
            display: block;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(255, 255, 255, 0.16);
            border-top-color: var(--brand-2);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(14px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-12px) scale(1.05); }
        }

        @media (max-width: 640px) {
            body {
                padding: 14px;
            }
            .change-password-container {
                padding: 24px 18px;
                border-radius: 16px;
            }
            .change-password-header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body class="luna-ui">
    <div class="change-password-container">
        <div class="change-password-header">
            <h1>BirdTV</h1>
            <p>请修改默认密码以继续</p>
        </div>

        <div class="warning-banner">
            ⚠️ 检测到您正在使用默认密码，为了安全起见，请立即修改密码！
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
        </div>

        <form id="changePasswordForm">
            <input type="text" name="username" id="username" autocomplete="username" tabindex="-1" style="position:absolute;left:-9999px" aria-hidden="true">
            <div class="form-group">
                <label for="oldPassword">当前密码</label>
                <input type="password" id="oldPassword" name="oldPassword" required autocomplete="current-password" placeholder="请输入当前密码">
            </div>

            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password" placeholder="请输入新密码（至少6位）">
            </div>

            <div class="form-group">
                <label for="confirmPassword">确认新密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="请再次输入新密码">
            </div>

            <button type="submit" class="change-password-button" id="changePasswordButton">修改密码</button>
        </form>
    </div>

    <script>
        const changePasswordForm = document.getElementById('changePasswordForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const changePasswordButton = document.getElementById('changePasswordButton');

        function showError(message) {
            successMessage.classList.remove('show');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function showSuccess(message) {
            errorMessage.classList.remove('show');
            successMessage.textContent = message;
            successMessage.classList.add('show');
        }

        function showLoading(show) {
            loadingSpinner.classList.toggle('show', show);
            changePasswordButton.disabled = show;
        }

        function getAuthToken() {
            return localStorage.getItem('authToken');
        }

        changePasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!oldPassword || !newPassword || !confirmPassword) {
                showError('请填写所有字段');
                return;
            }

            if (newPassword.length < 6) {
                showError('新密码至少需要6位');
                return;
            }

            if (newPassword !== confirmPassword) {
                showError('两次输入的新密码不一致');
                return;
            }

            const token = getAuthToken();
            if (!token) {
                showError('未找到登录信息，请重新登录');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('/api/auth/password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ oldPassword, newPassword })
                });

                let result;
                try {
                    result = await response.json();
                } catch {
                    result = { ok: false, message: `请求失败 (${response.status})` };
                }

                if (response.status === 401) {
                    showError('登录已过期，请重新登录');
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('userInfo');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                    return;
                }

                if (result.ok) {
                    showSuccess('密码修改成功！正在跳转到登录页面...');
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('userInfo');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showError(result.message || '密码修改失败');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
                console.error('Change password error:', error);
            } finally {
                showLoading(false);
            }
        });

        // 检查是否已登录
        window.addEventListener('load', () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = '/login.html';
            }
        });

        // 回车键提交
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !changePasswordButton.disabled) {
                changePasswordForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
    <script defer src="/assets/theme-switcher.js"></script>
</body>
</html>
