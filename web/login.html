<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - BirdTV</title>
    <link rel="stylesheet" href="/assets/luna-theme.css">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('birdtv.theme') || 'luna';
                var finalTheme = theme;
                if (theme === 'auto') {
                    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    finalTheme = dark ? 'graphite' : 'mist';
                }
                document.documentElement.setAttribute('data-theme', finalTheme);
            } catch {}
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(900px 500px at 80% -10%, rgba(76, 163, 255, 0.18), transparent 70%),
                radial-gradient(700px 420px at -10% 100%, rgba(108, 226, 255, 0.13), transparent 65%),
                linear-gradient(145deg, var(--bg-0) 0%, var(--bg-1) 50%, var(--bg-2) 100%);
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 280px;
            height: 280px;
            right: 8%;
            top: 10%;
            background: rgba(79, 157, 255, 0.28);
            animation: drift 10s ease-in-out infinite;
        }

        body::after {
            width: 240px;
            height: 240px;
            left: 8%;
            bottom: 8%;
            background: rgba(108, 226, 255, 0.2);
            animation: drift 12s ease-in-out infinite reverse;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: min(420px, 100%);
            padding: 34px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background:
                linear-gradient(160deg, rgba(255, 255, 255, 0.06), transparent 45%),
                linear-gradient(180deg, var(--card), var(--card-strong));
            box-shadow:
                0 26px 70px rgba(3, 10, 26, 0.75),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: rise-in .6s cubic-bezier(.25,.8,.25,1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 0.03em;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #d4e6ff 0%, #77bdff 65%, #7ee9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: #b7c9e8;
            font-weight: 600;
            margin-bottom: 7px;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid rgba(145, 184, 255, 0.2);
            border-radius: 10px;
            font-size: 15px;
            color: var(--text);
            background: rgba(14, 28, 57, 0.78);
            transition: border-color .25s, box-shadow .25s, transform .25s;
        }

        .form-group input::placeholder {
            color: rgba(154, 177, 217, 0.64);
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(108, 226, 255, 0.7);
            box-shadow: 0 0 0 3px rgba(108, 226, 255, 0.2);
            transform: translateY(-1px);
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 11px;
            font-size: 15px;
            font-weight: 700;
            color: #031128;
            cursor: pointer;
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            box-shadow: 0 10px 28px rgba(69, 154, 255, 0.35);
            transition: transform .22s, box-shadow .22s, filter .22s;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 34px rgba(69, 154, 255, 0.45);
            filter: saturate(1.08);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            background: rgba(255, 109, 122, 0.12);
            color: #ff9fa8;
            border: 1px solid rgba(255, 109, 122, 0.35);
            padding: 11px 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 16px;
        }

        .loading-spinner.show {
            display: block;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(255, 255, 255, 0.16);
            border-top-color: var(--brand-2);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(154, 177, 217, 0.82);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(14px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-12px) scale(1.05); }
        }

        @media (max-width: 640px) {
            body {
                padding: 14px;
            }
            .login-container {
                padding: 24px 18px;
                border-radius: 16px;
            }
            .login-header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body class="luna-ui luna-login">
    <div class="login-container">
        <div class="login-header">
            <h1>BirdTV</h1>
            <p>请登录以继续</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-button" id="loginButton">登录</button>
        </form>

        <div class="login-footer">
            默认账号: admin / admin123
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const loginButton = document.getElementById('loginButton');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function showLoading(show) {
            loadingSpinner.classList.toggle('show', show);
            loginButton.disabled = show;
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                let result;
                try {
                    result = await response.json();
                } catch {
                    result = { ok: false, message: `请求失败 (${response.status})` };
                }

                if (result.ok && result.data) {
                    // 保存token
                    localStorage.setItem('authToken', result.data.token);
                    localStorage.setItem('userInfo', JSON.stringify(result.data.user));

                    // 同时设置 Cookie（自动检测 HTTPS，添加 Secure 标志）
                    const isHttps = window.location.protocol === 'https:';
                    const secureFlag = isHttps ? '; Secure' : '';
                    document.cookie = `authToken=${result.data.token}; path=/; SameSite=Strict${secureFlag}`;
                    
                    // 检查是否使用默认密码
                    if (result.data.isDefaultPassword) {
                        // 跳转到修改密码页面
                        window.location.href = '/change-password.html';
                    } else {
                        // 跳转到主页
                        window.location.href = '/';
                    }
                } else {
                    showError(result.message || '登录失败，请检查用户名和密码');
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
                console.error('Login error:', error);
            } finally {
                showLoading(false);
            }
        });

        // 检查是否已登录
        window.addEventListener('load', () => {
            const token = localStorage.getItem('authToken');
            if (token) {
                window.location.href = '/';
            }
        });

        // 回车键提交
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !loginButton.disabled) {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
    <script defer src="/assets/theme-switcher.js"></script>
</body>
</html>
